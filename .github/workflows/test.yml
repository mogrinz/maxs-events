name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      # test_product.py and test_rc3.py exercise obsolete Max's Menu
      # menu/pricing routes, which are not part of Max's Events.
      - run: python -m pytest -q tests --ignore=tests/test_product.py --ignore=tests/test_rc3.py
      - run: python -m compileall -q .
      - run: bash -n setup.sh upgrade_v1_gold.sh run.sh
      - run: python install_theme_fonts.py
      - run: python build_release.py
